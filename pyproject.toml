[project]
name = "aakashvani"
version = "0.1.0"
description = "Aakashvani - AI-powered outbound voice agent platform (Pipecat + Plivo + Gemini Live)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.13.5",
  "alembic>=1.18.4",
  "asyncpg>=0.30.0",
  "boto3>=1.43.33",
  "dateparser>=1.2.0",
  "fastapi>=0.136.1",
  "google-generativeai>=0.8.6",
  "loguru>=0.7.3",
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "phonenumbers>=9.0.31",
  "pipecat-ai[cartesia,deepgram,elevenlabs,google,groq,openai,runner,sarvam,silero,websocket]>=1.0.0",
  "pipecatcloud>=0.4.4",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.27",
  "pytz>=2026.2",
  "redis>=5.0.0",
  "slowapi>=0.1.9",
  "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
