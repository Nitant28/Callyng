name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aakashvani
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aakashvani
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uvx ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://aakashvani:testpassword@localhost:5432/aakashvani
          REDIS_URL: redis://localhost:6379/0
          ADMIN_API_KEY: test-key-for-ci
        run: |
          uv run alembic upgrade head
          uv run pytest -x --tb=short

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail

            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            git config --global --add safe.directory /opt/aakashvani/app
            git config --global --add safe.directory /opt/aakashvani

            cd /opt/aakashvani/app

            echo "Expected SHA: ${DEPLOY_SHA}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "Deployed SHA: ${DEPLOYED_SHA}"
            if [ "${DEPLOYED_SHA}" != "${DEPLOY_SHA}" ]; then
              echo "ERROR: /opt/aakashvani/app HEAD (${DEPLOYED_SHA}) != GitHub SHA (${DEPLOY_SHA})"
              exit 1
            fi

            echo "Building backend image (native host arch)..."
            docker build -f Dockerfile.prod -t aakashvani-backend:latest .

            echo "Restarting backend..."
            cd /opt/aakashvani
            docker compose --env-file .env up -d --force-recreate backend

            echo "Running migrations..."
            docker exec aakashvani-backend uv run alembic upgrade head

            echo "Health check..."
            sleep 10
            curl -fsS http://localhost:7860/health

            echo ""
            echo "✅ Deploy successful (SHA ${DEPLOYED_SHA})"
