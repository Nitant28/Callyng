name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aakashvani
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aakashvani
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uvx ruff@0.16.0 check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://aakashvani:testpassword@localhost:5432/aakashvani
          REDIS_URL: redis://localhost:6379/0
          ADMIN_API_KEY: test-key-for-ci
        run: |
          uv run alembic upgrade head
          uv run pytest -x --tb=short

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.GH_DEPLOY_TOKEN }}" ]; then
            echo "::error::GH_DEPLOY_TOKEN secret is missing. Add a Personal Access Token (Contents: Read) as repo secret GH_DEPLOY_TOKEN."
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_USER }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::One of SERVER_HOST / SERVER_USER / SERVER_SSH_KEY secrets is missing in repository settings."
            exit 1
          fi

      - name: Test SSH connectivity to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          port="${SERVER_PORT:-22}"
          # Trim any hidden whitespace/newlines from host and user secrets
          host="$(echo -n "${SERVER_HOST}" | tr -d '[:space:]')"
          user="$(echo -n "${SERVER_USER}" | tr -d '[:space:]')"
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Attempting SSH connection test to ${user}@${host}:${port} (Host length: ${#host} chars, Timeout 10s)..."
          if ! ssh -vvv -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key -p "$port" "${user}@${host}" 'echo "SSH Connection OK"'; then
            echo "::error::SSH test failed. Check SERVER_HOST, SERVER_PORT (default 22), SERVER_USER, SERVER_SSH_KEY, and VPS firewall/UFW rules."
            rm -f /tmp/deploy_key
            exit 1
          fi
          rm -f /tmp/deploy_key

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}

          GH_REPO: ${{ github.repository }}
          # Private repo: use a classic/fine-grained PAT with Contents: Read.
          # Repo Settings → Secrets → Actions → GH_DEPLOY_TOKEN
          # Do NOT use GITHUB_TOKEN here — baking it into the VPS remote expires
          # after the job and breaks the next deploy ("Invalid username or token").
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_SHA,GH_REPO,GH_TOKEN
          script: |
            set -euo pipefail

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "ERROR: GH_DEPLOY_TOKEN secret is not set."
              echo "This is a private repo — create a PAT (Contents: Read) and add it as"
              echo "repo secret GH_DEPLOY_TOKEN, then re-run deploy."
              exit 1
            fi

            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            git config --global --add safe.directory /opt/aakashvani/app
            git config --global --add safe.directory /opt/aakashvani

            cd /opt/aakashvani/app

            echo "Expected SHA: ${DEPLOY_SHA}"

            # Clear any stale credentials baked into origin by older deploy scripts
            # (expired token in the URL → "Invalid username or token").
            git remote set-url origin "https://github.com/${GH_REPO}.git"

            # Authenticated one-shot fetch; do not store the token in origin.
            git fetch --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
              "+refs/heads/main:refs/remotes/origin/main"

            git checkout -B main origin/main
            git reset --hard origin/main

            # Ensure origin stays credential-free for the next run
            git remote set-url origin "https://github.com/${GH_REPO}.git"

            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "Deployed SHA: ${DEPLOYED_SHA}"
            if [ "${DEPLOYED_SHA}" != "${DEPLOY_SHA}" ]; then
              echo "ERROR: /opt/aakashvani/app HEAD (${DEPLOYED_SHA}) != GitHub SHA (${DEPLOY_SHA})"
              exit 1
            fi

            echo "Building backend image (native host arch)..."
            docker build -f Dockerfile.prod -t aakashvani-backend:latest .

            echo "Building frontend static assets..."
            if command -v npm >/dev/null 2>&1; then
              (cd frontend && npm ci && VITE_API_BASE_URL='' npm run build)
            else
              docker run --rm -v "$(pwd)/frontend:/app" -w /app node:20-alpine sh -c "npm ci && VITE_API_BASE_URL='' npm run build"
            fi

            echo "Updating frontend distribution directory..."
            mkdir -p /opt/aakashvani/frontend-dist
            rsync -avz --delete frontend/dist/ /opt/aakashvani/frontend-dist/

            echo "Restarting backend..."
            cd /opt/aakashvani
            docker compose --env-file .env up -d --force-recreate backend

            echo "Running migrations..."
            docker exec aakashvani-backend uv run alembic upgrade head

            echo "Health check..."
            success=0
            for i in $(seq 1 90); do
              if curl -fsS http://localhost:7860/health >/dev/null 2>&1; then
                echo "Health check passed!"
                success=1
                break
              fi
              echo "Waiting for health check ($i/90)..."
              sleep 2
            done
            if [ "$success" -ne 1 ]; then
              echo "ERROR: Health check timed out after 180s"
              docker logs aakashvani-backend --tail 100
              exit 1
            fi

            echo ""
            echo "✅ Deploy successful (SHA ${DEPLOYED_SHA})"
